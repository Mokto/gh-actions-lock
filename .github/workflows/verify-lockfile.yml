# Fails when .github/workflows/actions.lock is out of sync with the
# workflows or a locked pin no longer verifies upstream. Copy this file
# into your repository's .github/workflows/ and run `gh actions-lock` once
# to add it to your lockfile.
#
# --verify is read-only and calls the GitHub API to check every pin. The
# job's GITHUB_TOKEN can read public actions and this repository; if your
# workflows use actions from other private or internal repositories, pass
# a token that can read them instead. --verify-local works offline but only
# checks lockfile coverage, not that the pins are trustworthy.
#
# Exit codes: 0 valid, 1 findings to fix, 2 the check itself failed.

name: verify-lockfile

on:
  pull_request:
  push:
    branches:
      - main
  # Catches upstream changes, like a re-pointed tag, between pull requests.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.2.0
      - run: gh actions-lock --verify
